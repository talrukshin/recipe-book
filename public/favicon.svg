
                <svg width="150" height="150" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="cherryG2" x1="95" y1="65" x2="110" y2="85" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#ff758f"/>
                            <stop offset="100%" stop-color="#e11d48"/>
                        </linearGradient>
                        <filter id="bookShadow" x="-10%" y="-10%" width="130%" height="130%">
                            <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.15"/>
                        </filter>
                    </defs>

                    <g filter="url(#bookShadow)">
                        <!-- Hardcover Recipe Book -->
                        <rect x="42" y="30" width="116" height="146" rx="12" fill="#334155"/>
                        <!-- Book Spine Backing -->
                        <rect x="42" y="30" width="16" height="146" rx="4" fill="rgba(0,0,0,0.2)"/>
                        <line x1="58" y1="30" x2="58" y2="176" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
                        
                        <!-- Real Pages Edge Effect -->
                        <path d="M158 36 H163 V170 H158 Z" fill="#cbd5e1"/>
                        <path d="M158 38 H161 V168 H158 Z" fill="#f8fafc"/>

                        <!-- Golden / White Decorative Frame on Cover -->
                        <rect x="68" y="44" width="76" height="118" rx="6" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>

                        <!-- Ribbon Bookmark Hanging Down -->
                        <path d="M128 30 V72 L136 65 L144 72 V30 H128 Z" fill="#e11d48"/>
                    </g>

                    <!-- Cupcake Icon Stamped on Cover -->
                    <g transform="translate(106, 110)">
                        <!-- Wrapper -->
                        <path d="M-18 6 L-13 28 H13 L18 6 Z" fill="#d97706"/>
                        <line x1="-9" y1="6" x2="-6" y2="28" stroke="rgba(0,0,0,0.15)" stroke-width="2"/>
                        <line x1="0" y1="6" x2="0" y2="28" stroke="rgba(0,0,0,0.15)" stroke-width="2"/>
                        <line x1="9" y1="6" x2="6" y2="28" stroke="rgba(0,0,0,0.15)" stroke-width="2"/>

                        <!-- Cream Swirls -->
                        <path d="M-22 7 C-22 -5 -10 -10 0 -10 C10 -10 22 -5 22 7 Z" fill="#ffffff"/>
                        <path d="M-15 -3 C-15 -16 -6 -20 0 -20 C6 -20 15 -16 15 -3 Z" fill="#ffffff"/>

                        <!-- Cherry -->
                        <path d="M0 -20 C4 -30 12 -33 16 -34" stroke="#16a34a" stroke-width="2" stroke-linecap="round" fill="none"/>
                        <circle cx="0" cy="-22" r="8" fill="url(#cherryG2)"/>
                        <circle cx="-2" cy="-24" r="2" fill="#ffffff"/>
                    </g>
                </svg>